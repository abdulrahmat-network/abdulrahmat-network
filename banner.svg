<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d0d0d; }
      .grid-line { stroke: #242424; stroke-width: 1; }
      .grid-dashed { stroke: #2a2a2a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .ring-solid { stroke: #333333; stroke-width: 1; fill: none; }
      
      .font-sans-bold {
        font-family: 'Inter', 'Helvetica Neue', 'Arial Black', sans-serif;
        font-weight: 900;
        fill: #ffffff;
        font-size: 80px;
        letter-spacing: -2px;
      }
      .font-mono-sm {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-size: 12px;
        fill: #a0a0a0;
        letter-spacing: 1px;
      }
      .font-mono-xs {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-size: 9px;
        fill: #777777;
        letter-spacing: 0.8px;
      }
      .font-sub {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 20px;
        fill: #d4d4d4;
        font-weight: 400;
      }
      .accent-fill { fill: #ff3b1d; }
      .accent-text { fill: #ff3b1d; font-weight: 700; }
      
      /* Animations */
      @keyframes rotateSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseCore {
        0%, 100% { r: 4px; opacity: 0.9; }
        50% { r: 7px; opacity: 0.3; }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes packetMove1 {
        0% { cx: 1010; cy: 210; opacity: 1; }
        100% { cx: 929; cy: 129; opacity: 0; }
      }
      @keyframes packetMove2 {
        0% { cx: 1010; cy: 210; opacity: 1; }
        100% { cx: 956; cy: 264; opacity: 0; }
      }
      @keyframes packetMove3 {
        0% { cx: 1010; cy: 210; opacity: 1; }
        100% { cx: 1064; cy: 156; opacity: 0; }
      }

      /* 5 Roles Cyclical Rolling Animation (Total 15s cycle) */
      @keyframes roll1 {
        0%, 16%   { opacity: 1; transform: translateY(0); }
        20%, 100% { opacity: 0; transform: translateY(-15px); }
      }
      @keyframes roll2 {
        0%, 16%   { opacity: 0; transform: translateY(15px); }
        20%, 36%  { opacity: 1; transform: translateY(0); }
        40%, 100% { opacity: 0; transform: translateY(-15px); }
      }
      @keyframes roll3 {
        0%, 36%   { opacity: 0; transform: translateY(15px); }
        40%, 56%  { opacity: 1; transform: translateY(0); }
        60%, 100% { opacity: 0; transform: translateY(-15px); }
      }
      @keyframes roll4 {
        0%, 56%   { opacity: 0; transform: translateY(15px); }
        60%, 76%  { opacity: 1; transform: translateY(0); }
        80%, 100% { opacity: 0; transform: translateY(-15px); }
      }
      @keyframes roll5 {
        0%, 76%   { opacity: 0; transform: translateY(15px); }
        80%, 96%  { opacity: 1; transform: translateY(0); }
        100%      { opacity: 0; transform: translateY(-15px); }
      }

      .radar-sweep {
        transform-origin: 1010px 210px;
        animation: rotateSlow 14s linear infinite;
      }
      .outer-arc {
        transform-origin: 1010px 210px;
        animation: rotateReverse 24s linear infinite;
      }
      .core-pulse { animation: pulseCore 3s ease-in-out infinite; }
      .cursor-blink { animation: blinkCursor 1.2s infinite; }
      
      .pkt-1 { animation: packetMove1 3.2s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
      .pkt-2 { animation: packetMove2 4.1s cubic-bezier(0.16, 1, 0.3, 1) infinite 1s; }
      .pkt-3 { animation: packetMove3 3.6s cubic-bezier(0.16, 1, 0.3, 1) infinite 2s; }

      /* Role Animation Classes */
      .r-1 { animation: roll1 15s infinite; }
      .r-2 { animation: roll2 15s infinite; }
      .r-3 { animation: roll3 15s infinite; }
      .r-4 { animation: roll4 15s infinite; }
      .r-5 { animation: roll5 15s infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" class="bg" />

  <!-- Structural Grid Lines -->
  <line x1="0" y1="62" x2="1200" y2="62" class="grid-line" />
  <line x1="0" y1="376" x2="1200" y2="376" class="grid-line" />
  <line x1="850" y1="0" x2="850" y2="376" class="grid-line" />
  <line x1="1030" y1="0" x2="1030" y2="62" class="grid-line" />

  <!-- Top Left Header -->
  <g transform="translate(32, 16)">
    <polygon points="15,2 27,9 27,23 15,30 3,23 3,9" fill="none" stroke="#666" stroke-width="1.2" />
    <line x1="15" y1="2" x2="15" y2="30" stroke="#444" stroke-width="0.8" />
    <line x1="3" y1="9" x2="27" y2="23" stroke="#444" stroke-width="0.8" />
    <line x1="27" y1="9" x2="3" y2="23" stroke="#444" stroke-width="0.8" />
    <circle cx="15" cy="16" r="3" fill="#ff3b1d" />
    
    <text x="40" y="20" class="font-mono-sm" fill="#ffffff" font-weight="bold">ABDUL RAHMAT</text>
    <text x="142" y="20" class="font-mono-sm accent-text">//</text>
    <text x="166" y="20" class="font-mono-sm">NETWORK ENGINEER</text>
  </g>

  <!-- Top Right Header -->
  <g text-anchor="end">
    <text x="1168" y="28" class="font-mono-sm" fill="#d4d4d4">ESTD. 2026</text>
    <text x="1168" y="45" class="font-mono-sm" fill="#777777">abdulrahmat-network</text>
  </g>

  <!-- Main Typography & Rolling Roles -->
  <g transform="translate(30, 0)">
    <text x="0" y="162" class="font-sans-bold">ABDUL RAHMAT</text>
    
    <!-- Rolling Dynamic Roles Container (5 Roles) -->
    <g transform="translate(0, 246)">
      <!-- 1. NETWORK ENGINEER -->
      <text x="0" y="0" class="font-sans-bold r-1" style="font-size: 66px; fill: transparent; stroke: #ffffff; stroke-width: 1.8px;">NETWORK ENGINEER</text>
      <!-- 2. NOC OPERATIONS -->
      <text x="0" y="0" class="font-sans-bold r-2" style="font-size: 66px; fill: transparent; stroke: #ffffff; stroke-width: 1.8px; position: absolute;">NOC OPERATIONS</text>
      <!-- 3. ROUTING & SWITCHING -->
      <text x="0" y="0" class="font-sans-bold r-3" style="font-size: 54px; fill: transparent; stroke: #ffffff; stroke-width: 1.8px; position: absolute;">ROUTING & SWITCHING</text>
      <!-- 4. INFRASTRUCTURE TECH -->
      <text x="0" y="0" class="font-sans-bold r-4" style="font-size: 58px; fill: transparent; stroke: #ffffff; stroke-width: 1.8px; position: absolute;">INFRASTRUCTURE TECH</text>
      <!-- 5. HOMELAB ENTHUSIAST -->
      <text x="0" y="0" class="font-sans-bold r-5" style="font-size: 58px; fill: transparent; stroke: #ffffff; stroke-width: 1.8px; position: absolute;">HOMELAB ENTHUSIAST</text>
    </g>

    <!-- Red Accent Badge -->
    <rect x="2" y="278" width="166" height="26" class="accent-fill" rx="1" />
    <text x="12" y="295" class="font-mono-sm" fill="#0d0d0d" font-weight="bold">abdulrahmat-network</text>
    <rect x="154" y="285" width="6" height="12" fill="#0d0d0d" class="cursor-blink" />

    <!-- Subtitle -->
    <text x="2" y="340" class="font-sub">Building, automating, and securing network infrastructure.</text>
  </g>

  <!-- Right Side: Radar & Topologies -->
  <g>
    <circle cx="1010" cy="210" r="130" class="ring-solid" />
    <circle cx="1010" cy="210" r="98" class="grid-dashed" />
    <circle cx="1010" cy="210" r="65" class="ring-solid" />
    <circle cx="1010" cy="210" r="32" class="grid-dashed" />
    <circle cx="1010" cy="210" r="14" class="ring-solid" />

    <line x1="905" y1="105" x2="1115" y2="315" class="grid-line" />
    <line x1="905" y1="315" x2="1115" y2="105" class="grid-line" />
    <line x1="865" y1="210" x2="1155" y2="210" class="grid-line" />

    <g class="outer-arc">
      <circle cx="1010" cy="210" r="130" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="90 320" />
    </g>

    <g class="radar-sweep">
      <circle cx="1010" cy="210" r="76" fill="none" stroke="#ff3b1d" stroke-width="3.5" stroke-dasharray="115 365" stroke-linecap="round" />
    </g>

    <circle cx="1010" cy="210" r="2.5" fill="#ff3b1d" class="pkt-1" />
    <circle cx="1010" cy="210" r="2.5" fill="#ff3b1d" class="pkt-2" />
    <circle cx="1010" cy="210" r="2.5" fill="#ff3b1d" class="pkt-3" />

    <circle cx="1010" cy="210" r="4" fill="#ff3b1d" class="core-pulse" />
    <text x="1028" y="213" class="font-mono-xs" fill="#cccccc">CORE</text>

    <circle cx="929" cy="129" r="4.5" fill="#444444" stroke="#0d0d0d" stroke-width="1.5" />
    <text x="900" y="132" class="font-mono-xs">WAN</text>

    <circle cx="1064" cy="156" r="4.5" fill="#222222" stroke="#777777" stroke-width="1.2" />
    <text x="1073" y="159" class="font-mono-xs">WAN</text>

    <circle cx="956" cy="264" r="4.5" fill="#222222" stroke="#777777" stroke-width="1.2" />
    <text x="928" y="267" class="font-mono-xs">WAN</text>
  </g>

  <!-- Bottom Footer Bar -->
  <g transform="translate(32, 403)">
    <text x="0" y="0" class="font-mono-sm">01 <tspan class="accent-text">/</tspan> ROUTING & SWITCHING</text>
    <text x="515" y="0" class="font-mono-sm">02 <tspan class="accent-text">/</tspan> AUTOMATION</text>
    <text x="1045" y="0" class="font-mono-sm">03 <tspan class="accent-text">/</tspan> HOMELAB</text>
  </g>
</svg>
