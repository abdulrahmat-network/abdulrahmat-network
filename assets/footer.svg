<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="Thanks for stopping by">
<title>Thanks for stopping by</title>
<defs><style>
.silk-sm{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:9px;font-weight:700;fill:#8b939c;letter-spacing:1px}
.tape{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;fill:#16181b}
@keyframes act{0%,30%,55%,100%{opacity:1}35%,60%,75%{opacity:.12}40%,80%{opacity:1}}
.a1{animation:act .9s step-end infinite}.a2{animation:act 1.3s step-end .2s infinite}
.a3{animation:act 1.7s step-end .5s infinite}.a4{animation:act 2.3s step-end .1s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
